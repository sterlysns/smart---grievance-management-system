<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Smart Grievance</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #123b70, #4f7cac);
        }

        .login-card {
            width: 90%;
            max-width: 430px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #123b70;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #123b70;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #123b70;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d2d57;
        }

        .error {
            display: none;
            margin-top: 18px;
            padding: 12px;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 8px;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #123b70;
            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="login-card">

        <div class="logo">🔐</div>

        <h1>Admin Login</h1>

        <p class="subtitle">
            Smart Government Grievance Management System
        </p>


        <form id="loginForm">

            <label>Username</label>

            <input
                type="text"
                id="username"
                placeholder="Enter admin username"
                required
            >


            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <div
            id="error"
            class="error">
            Invalid username or password.
        </div>


        <a
            href="index.html"
            class="back">
            ← Back to Home
        </a>

    </div>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const username =
                    document
                    .getElementById("username")
                    .value
                    .trim();


                const password =
                    document
                    .getElementById("password")
                    .value;


                /*
                 * Demo admin credentials
                 */

                if (
                    username === "admin" &&
                    password === "admin123"
                ) {

                    sessionStorage.setItem(
                        "adminLoggedIn",
                        "true"
                    );


                    window.location.href =
                        "admin.html";

                }

                else {

                    document
                        .getElementById("error")
                        .style.display = "block";

                }

            });

    </script>

</body>
</html>
