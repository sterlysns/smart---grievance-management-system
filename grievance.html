<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>File Grievance | Smart Government</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eef5ff, #f8fbff);
            min-height: 100vh;
            color: #1f2937;
        }

        nav {
            background: #123b70;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        nav h2 {
            font-size: 22px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #123b70;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
        }

        textarea {
            height: 130px;
            resize: vertical;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #123b70;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d2d57;
        }

        #result {
            display: none;
            margin-top: 30px;
            padding: 25px;
            background: #f0f7ff;
            border-left: 5px solid #123b70;
            border-radius: 10px;
        }

        .result-row {
            margin: 12px 0;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #fff3cd;
            color: #856404;
            font-weight: bold;
        }

        .complaint-id {
            font-size: 22px;
            font-weight: bold;
            color: #123b70;
        }
    </style>
</head>

<body>

<nav>

    <h2>Smart Grievance</h2>

    <div>
        <a href="index.html">Home</a>
        <a href="grievance.html">File Grievance</a>
        <a href="track.html">Track</a>
    </div>

</nav>


<div class="container">

    <div class="card">

        <h1>File a Grievance</h1>

        <p class="subtitle">
            Submit your complaint and our smart system will analyze and route it.
        </p>


        <form id="grievanceForm">

            <label>Full Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >


            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label>Location</label>

            <input
                type="text"
                id="location"
                placeholder="Street / Area / City"
                required
            >


            <label>Pincode</label>

            <input
                type="text"
                id="pincode"
                placeholder="Enter pincode"
                required
            >


            <label>Complaint Description</label>

            <textarea
                id="description"
                placeholder="Describe your problem in your own words..."
                required
            ></textarea>


            <label>Evidence</label>

            <input
                type="file"
                id="evidence"
            >


            <button type="submit">
                Submit Grievance
            </button>

        </form>


        <div id="result">

            <h2>Complaint Analysis</h2>


            <div class="result-row">

                <strong>Complaint ID:</strong>

                <div
                    class="complaint-id"
                    id="complaintId">
                </div>

            </div>


            <div class="result-row">

                <strong>Category:</strong>

                <span id="category"></span>

            </div>


            <div class="result-row">

                <strong>Department:</strong>

                <span id="department"></span>

            </div>


            <div class="result-row">

                <strong>Local Office:</strong>

                <span id="office"></span>

            </div>


            <div class="result-row">

                <strong>Priority:</strong>

                <span id="priority"></span>

            </div>


            <div class="result-row">

                <strong>Status:</strong>

                <span class="status">
                    Submitted
                </span>

            </div>

        </div>

    </div>

</div>


<script>

document
    .getElementById("grievanceForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const name =
            document.getElementById("name").value;

        const email =
            document.getElementById("email").value;

        const location =
            document.getElementById("location").value;

        const pincode =
            document.getElementById("pincode").value;

        const description =
            document.getElementById("description").value;


        const text =
            description.toLowerCase();


        let category =
            "General Grievance";

        let department =
            "District Administration";

        let office =
            "Local Government Office";

        let priority =
            "Medium";


        if (
            text.includes("street light") ||
            text.includes("road") ||
            text.includes("pothole") ||
            text.includes("drain")
        ) {

            category =
                "Public Infrastructure";

            department =
                "Municipal Department";

            office =
                "Local Ward Office";
        }


        else if (
            text.includes("garbage") ||
            text.includes("waste") ||
            text.includes("sanitation")
        ) {

            category =
                "Sanitation";

            department =
                "Municipal Sanitation Department";

            office =
                "Local Sanitation Office";
        }


        else if (
            text.includes("water") ||
            text.includes("water leakage") ||
            text.includes("pipeline")
        ) {

            category =
                "Water Supply";

            department =
                "Water Supply Department";

            office =
                "Local Water Board Office";
        }


        else if (
            text.includes("electricity") ||
            text.includes("power") ||
            text.includes("current")
        ) {

            category =
                "Electricity";

            department =
                "Electricity Department";

            office =
                "Local Electricity Office";
        }


        if (
            text.includes("danger") ||
            text.includes("emergency") ||
            text.includes("accident")
        ) {

            priority =
                "High";
        }


        const complaintId =
            "GRV" +
            new Date().getFullYear() +
            Math.floor(
                10000 + Math.random() * 90000
            );


        const complaint = {

            id: complaintId,

            name: name,

            email: email,

            location: location,

            pincode: pincode,

            description: description,

            category: category,

            department: department,

            office: office,

            priority: priority,

            status: "Submitted",

            date: new Date().toLocaleString()

        };


        let complaints =
            JSON.parse(
                localStorage.getItem("complaints")
            ) || [];


        complaints.push(complaint);


        localStorage.setItem(
            "complaints",
            JSON.stringify(complaints)
        );


        document
            .getElementById("complaintId")
            .textContent = complaintId;


        document
            .getElementById("category")
            .textContent = category;


        document
            .getElementById("department")
            .textContent = department;


        document
            .getElementById("office")
            .textContent = office;


        document
            .getElementById("priority")
            .textContent = priority;


        document
            .getElementById("result")
            .style.display = "block";


        document
            .getElementById("result")
            .scrollIntoView({
                behavior: "smooth"
            });

    });

</script>

</body>
</html>
